# Claude Code GitHub Action.
#
# The SEO console (/admin/seo → "Fix with Claude") files an issue here that
# starts with "@claude" whenever a fix needs a code change — page copy on
# /mls, /about, /work-with/* and the other pages built in source rather than
# the CMS. This workflow picks the issue up, has Claude make the change on a
# branch, and opens a pull request for review. Nothing reaches main (and so
# nothing deploys) until that PR is merged.
#
# The same trigger works by hand: open an issue or comment "@claude …".
#
# One-time setup:
#   1. Install the Claude GitHub App on this repository.
#   2. Runs on the Claude subscription, not API billing: run `claude setup-token`
#      locally and store the result as the repository secret
#      CLAUDE_CODE_OAUTH_TOKEN (Settings → Secrets and variables → Actions).
#   3. For the console to file issues: a fine-grained personal access token
#      scoped to this repository only, with Issues: read & write, set on the
#      server with `fly secrets set GITHUB_TOKEN=… GITHUB_REPO=Spenny18/rivers-real-estate-production`.
#      (It must be a personal token: issues opened with an Actions token don't
#      trigger workflows.)
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --allowedTools "Bash(npm ci),Bash(npm run check),Bash(npm run build),Bash(gh pr create:*)"
            --append-system-prompt "This is the Rivers Real Estate site (Express + React + SQLite, deployed to Fly on merge to main). Work on a branch and finish by opening a pull request against main with gh pr create; never push to main. Server-rendered SEO strings in server/seo-inject.ts must stay identical to the page's <SeoHead> strings. Use Canadian spelling."

      # The action hides Claude's output (it can contain file contents), so a
      # run that dies before doing anything — e.g. a rejected
      # CLAUDE_CODE_OAUTH_TOKEN — only logs "is_error:true". Print just the
      # final result message, which names the actual error.
      - name: Show Claude error
        if: failure()
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file || format('{0}/claude-execution-output.json', runner.temp) }}
        run: |
          [ -f "$EXECUTION_FILE" ] || { echo "No execution output file."; exit 0; }
          jq -r '(if type == "array" then . else [.] end)
                 | map(select(.type == "result")) | last
                 | .result // (.errors | tostring?) // "No error text in the result."' "$EXECUTION_FILE"
