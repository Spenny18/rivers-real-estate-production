<!--
  Rivers Real Estate favicon — the actual logo mark, traced from
  client/public/rivers-logo.jpg (measured stroke by stroke, so the geometry
  is the logo's, not a redrawing): the open roofline running down to the
  right wall, the gap between the upper wall and the inner room, the inner
  L, the doorway on the right, and the 2×2 window grid. Same gold gradient.

  Google crops favicons to a circle in search results, so the mark sits well
  inside the tile with nothing meaningful near the corners.

  The raster set (favicon.ico, favicon-96x96, favicon-192x192,
  favicon-512x512, apple-touch-icon) is rendered from this file by
  script/favicons.ts — regenerate it if this changes.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640">
  <defs>
    <!-- The logo's metallic sweep, sampled from rivers-logo.jpg. It runs
         diagonally (down-right, in logo coordinates x+y): flat brand gold
         across the upper left, a bright highlight band through the inner L
         and the roof, a dark trough down the right wall and doorway, then
         back to brand gold at the bottom right. userSpaceOnUse so the
         stops sit exactly where they do on the logo. -->
    <linearGradient id="riversGold" gradientUnits="userSpaceOnUse" x1="454" y1="0" x2="1021.5" y2="567.5">
      <stop offset="0%"    stop-color="#CE9720"/>
      <stop offset="26%"   stop-color="#CE9720"/>
      <stop offset="33%"   stop-color="#E8C873"/>
      <stop offset="39.3%" stop-color="#FDECB4"/>
      <stop offset="46%"   stop-color="#D8C38A"/>
      <stop offset="53%"   stop-color="#95793A"/>
      <stop offset="60%"   stop-color="#7A5D19"/>
      <stop offset="71%"   stop-color="#98701B"/>
      <stop offset="83%"   stop-color="#B6851C"/>
      <stop offset="100%"  stop-color="#CE9720"/>
    </linearGradient>
  </defs>

  <rect width="640" height="640" fill="#000"/>

  <!-- Logo coordinates: the mark spans x 454–982, y 0–607 in the source
       image. Scaled to 420px tall and centred on the tile. -->
  <g transform="translate(-176.7 110) scale(0.692)" fill="url(#riversGold)">
    <!-- Roof -->
    <polygon points="454,0 982,165 982,206 454,41"/>
    <!-- Right wall -->
    <rect x="941" y="165" width="41" height="442"/>
    <!-- Left wall, upper (stops short of the inner room) -->
    <rect x="454" y="0" width="41" height="257"/>
    <!-- Inner room: the L -->
    <rect x="454" y="297" width="273" height="41"/>
    <rect x="454" y="297" width="41" height="310"/>
    <!-- Doorway frame -->
    <rect x="772" y="297" width="127" height="41"/>
    <rect x="772" y="297" width="41" height="310"/>
    <!-- Windows -->
    <rect x="562" y="428" width="41" height="42"/>
    <rect x="627" y="428" width="42" height="42"/>
    <rect x="562" y="491" width="41" height="42"/>
    <rect x="627" y="491" width="42" height="42"/>
  </g>
</svg>
