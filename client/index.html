<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <!-- Google only indexes favicons served from a real URL (data: URIs are
         ignored) and wants a square icon of at least 48px. /favicon.ico is
         also fetched by legacy crawlers regardless of these tags. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The manifest name, application-name and this <title> are among the
         signals Google reads when deciding what to show as the site name above
         the URL in search results. Keep them identical to WebSite.name in
         server/schema/entities.ts and og:site_name in server/seo-inject.ts. -->
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="application-name" content="Luxury Homes Calgary - Rivers Real Estate" />
    <meta name="apple-mobile-web-app-title" content="Rivers Real Estate" />
    <meta name="theme-color" content="#000000" />
    <title>Luxury Homes Calgary - Rivers Real Estate</title>
    <meta name="description" content="Spencer Rivers — luxury homes in Springbank Hill, Aspen Woods, Upper Mount Royal, Elbow Park, Britannia, and Bel-Aire. Synterra Realty." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Manrope:wght@200;300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- GA4 (property also queried by /admin/analytics via the GA4 Data API).
         GA4 auto-tracks SPA history changes (enhanced measurement). -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-TDK5S696RM"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag("js", new Date());
      gtag("config", "G-TDK5S696RM");
    </script>
    <!-- Follow Up Boss Widget Tracker (pixel). Initialises the tracker and
         fires the first pageview. SPA route changes are tracked separately
         in client/src/App.tsx via the usePageviewTracker hook. -->
    <script>
      (function (w, i, d, g, e, t) {
        w["WidgetTrackerObject"] = g;
        (w[g] = w[g] || function () { (w[g].q = w[g].q || []).push(arguments); }),
          (w[g].ds = 1 * new Date());
        (e = "script"),
          (t = d.createElement(e)),
          (e = d.getElementsByTagName(e)[0]);
        t.async = 1;
        t.src = i;
        e.parentNode.insertBefore(t, e);
      })(window, "https://widgetbe.com/agent", document, "widgetTracker");
      window.widgetTracker("create", "WT-GFURXFCK");
      window.widgetTracker("send", "pageview");
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
