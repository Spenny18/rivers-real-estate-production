# fly.toml — Rivers Real Estate platform
#
# Edit `app` to your chosen Fly.io app name (must be globally unique).
# Set up the persistent volume once with:
#   fly volumes create rivers_data --region sea --size 1
# Then deploy with:
#   fly deploy

app = "luxury-homes-calgary"
# sjc, not sea: the rivers_data volume (production SQLite) lives in sjc and
# volumes cannot change regions. With "sea" here, any deploy that has to
# create a machine fails with "needs an unattached volume in region 'sea'" —
# and on 2026-08-12 that took the site down when a capacity error during a
# deploy destroyed the old machine and no replacement could launch.
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  # DB_PATH is set inside the Dockerfile to /data/rivers.db, which is the
  # mount point of the persistent volume below.

[http_service]
  internal_port = 8080
  force_https = true
  # Keep 1 machine warm. The previous `auto_stop_machines = "stop"` +
  # `min_machines_running = 0` combo let the machine shut down between
  # requests, and the resulting 5–15 s cold-start would time out Google's
  # sitemap fetcher (status: "Couldn't fetch") and feel slow to real users.
  # Costs ~$2–5/mo on shared-cpu-1x — worth it for SEO reliability.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  # /healthz is `res.send("ok")`, registered ahead of the logging middleware,
  # so it costs nothing to serve. When it misses its deadline that is never
  # the endpoint being slow — it is the single event loop being busy, most
  # often with SSR renders.
  #
  # The old 5s timeout was tight enough that an admin pressing Rescan (which
  # crawls 160 of our own routes, each a full SSR render) could fail the check
  # and have this machine pulled out of rotation. With min_machines_running = 1
  # there is nothing to fail over TO, so being marked unhealthy does not move
  # traffic somewhere better — it just stops serving. A strict check on a
  # single-machine deploy trades availability for nothing.
  #
  # 10s timeout and a 30s grace period leave room for a burst without going
  # dark. A genuinely dead app is still caught inside ~40s, which is the right
  # side of the trade when the alternative is self-inflicted downtime.
  [[http_service.checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "30s"
    method = "GET"
    path = "/healthz"

[[mounts]]
  source = "rivers_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1
